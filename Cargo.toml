[workspace]
members = ["crates/marklight-core", "crates/marklight-render", "crates/marklight-cli", "apps/desktop/src-tauri"]
default-members = ["crates/marklight-core", "crates/marklight-render", "crates/marklight-cli"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/OthmaneBlial/marklight"

[workspace.dependencies]
marklight-core = { path = "crates/marklight-core", version = "0.1.1" }
marklight-render = { path = "crates/marklight-render", version = "0.1.1" }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0
